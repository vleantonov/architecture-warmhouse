openapi: 3.1.0
info:
  title: Тёплый дом — сервис управления параметрами датчиков
  version: 1.0.0
  description: Проверка и выполнение команд устройств.
servers:
- url: https://parameters.warmhouse.example/api/v1
paths:
  /execution:
    post:
      operationId: execute_command
      summary: Выполнить команду
      responses:
        '204':
          description: Команда выполнена.
        '400':
          $ref: '#/components/responses/error_400'
        '401':
          $ref: '#/components/responses/error_401'
        '403':
          $ref: '#/components/responses/error_403'
        '404':
          $ref: '#/components/responses/error_404'
        '409':
          $ref: '#/components/responses/error_409'
        '422':
          $ref: '#/components/responses/error_422'
        '500':
          $ref: '#/components/responses/error_500'
        '502':
          $ref: '#/components/responses/error_502'
        '503':
          $ref: '#/components/responses/error_503'
        '504':
          $ref: '#/components/responses/error_504'
      description: >-
        Изменяет параметр устройства.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/command'
            examples:
              thermostat:
                summary: Установить 22 °C
                value:
                  device_id: 00000003-0000-4000-8000-000000000001
                  parameter: target_temperature
                  value: 22
              light:
                summary: Включить реле света
                value:
                  device_id: 00000003-0000-4000-8000-000000000001
                  parameter: power
                  value: 'on'
              gate:
                summary: Запереть ворота
                value:
                  device_id: 00000003-0000-4000-8000-000000000001
                  parameter: lock_state
                  value: locked
  /validation:
    get:
      operationId: validate_command
      summary: Проверить команду
      description: Проверяет допустимость команды устройства.
      parameters:
      - name: device_id
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/command/properties/device_id'
        example: 00000003-0000-4000-8000-000000000001
      - name: parameter
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/command/properties/parameter'
        example: target_temperature
      - name: value
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/command/properties/value'
        description: Значение параметра устройства.
        example: 22
      responses:
        '204':
          description: Команда прошла проверку.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        '400':
          $ref: '#/components/responses/error_400'
        '404':
          $ref: '#/components/responses/error_404'
        '422':
          $ref: '#/components/responses/error_422'
        '503':
          $ref: '#/components/responses/error_503'
        '401':
          $ref: '#/components/responses/error_401'
        '403':
          $ref: '#/components/responses/error_403'
components:
  schemas:
    error:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
        request_id:
          type: string
          format: uuid
        details:
          type: object
          additionalProperties: true
      required:
      - code
      - message
      - request_id
    command:
      type: object
      additionalProperties: false
      properties:
        device_id:
          type: string
          format: uuid
        parameter:
          type: string
          enum:
          - target_temperature
          - power
          - lock_state
        value:
          oneOf:
          - type: number
          - type: string
            enum:
            - 'on'
            - 'off'
            - locked
            - unlocked
      required:
      - device_id
      - parameter
      - value
      oneOf:
      - properties:
          parameter:
            const: target_temperature
          value:
            type: number
            description: Целевая температура в Cel (°C).
      - properties:
          parameter:
            const: power
          value:
            type: string
            enum:
            - 'on'
            - 'off'
      - properties:
          parameter:
            const: lock_state
          value:
            type: string
            enum:
            - locked
            - unlocked
      description: Команда изменения параметра устройства.
  responses:
    error_400:
      description: Некорректный запрос.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'
    error_403:
      description: Доступ запрещён.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'
          example:
            code: FORBIDDEN
            message: Недостаточно прав для доступа к ресурсу.
            request_id: 00000000-0000-4000-8000-000000000001
    error_404:
      description: Устройство не найдено.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'
          example:
            code: DEVICE_NOT_FOUND
            message: Устройство не найдено.
            request_id: 00000009-0000-4000-8000-000000000004
    error_422:
      description: Недопустимая команда.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'
    error_503:
      description: Сервис или устройство недоступны.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'
    error_401:
      description: Ошибка аутентификации.
      headers:
        WWW-Authenticate:
          schema:
            type: string
          example: Bearer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'
    error_409:
      description: Конфликт состояния устройства.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'
          example:
            code: DEVICE_REJECTED
            message: Устройство отказалось применить значение.
            request_id: 00000009-0000-4000-8000-000000000001
    error_500:
      description: Внутренняя ошибка сервиса.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'
    error_502:
      description: Некорректный ответ устройства.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'
    error_504:
      description: Таймаут устройства.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'
          example:
            code: DEVICE_TIMEOUT
            message: Подтверждение от устройства не получено; команда могла примениться.
            request_id: 00000009-0000-4000-8000-000000000002
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
      description: Bearer-токен пользователя.
security:
- bearer_auth: []
